<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card source</title>
<!--
  Source for the 1200x630 Open Graph cards. Not deployed as a page; it is
  rendered once and screenshotted into assets/og-cover.png (?lang=tr for the
  Turkish card). Serve the repo locally and open /brand/og-source.html.
-->
<style>
  /* Inter is embedded locally (SIL OFL) so headless rendering does not depend
     on a network font fetch; fonts/ holds the two subsets we need. */
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 600; font-display: block;
    src: url("fonts/inter-latin.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 400 600; font-display: block;
    src: url("fonts/inter-latin-ext.woff2") format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; }
  .card {
    width: 1200px; height: 630px;
    background: #14120b;
    color: #edecec;
    font-family: Inter, system-ui, sans-serif;
    padding: 84px 96px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; right: -180px; top: -180px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,163,126,0.22) 0%, rgba(79,163,126,0) 70%);
  }
  .wordmark {
    width: 300px; height: 72px; background: #edecec;
    -webkit-mask: url("/assets/wordmark.png") no-repeat left center / contain;
    mask: url("/assets/wordmark.png") no-repeat left center / contain;
  }
  h1 {
    font-size: 76px; font-weight: 400; line-height: 1.08;
    letter-spacing: -0.035em; max-width: 880px; position: relative;
  }
  .meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 22px; font-weight: 500; letter-spacing: 0.01em;
    color: rgba(237,236,236,0.55);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4fa37e; }
</style>
</head>
<body>
<div class="card">
  <div class="wordmark" role="img" aria-label="justdukkan"></div>
  <h1 id="headline">Custom AI Agent Teams</h1>
  <div class="meta"><span class="dot"></span><span id="sub">Orchestrator, specialist agents, MCP servers and typed tools</span></div>
</div>
<script>
  if (new URLSearchParams(location.search).get('lang') === 'tr') {
    document.documentElement.lang = 'tr';
    document.getElementById('headline').textContent = 'Şirketinize Özel AI Agent Takımları';
    document.getElementById('sub').textContent = 'Orkestratör, uzman agent’lar, MCP sunucuları ve tipli tool’lar';
  }
</script>
</body>
</html>
